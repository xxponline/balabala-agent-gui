[workspace]
# service-management-framework task 1.1/1.2: 单 package → workspace (纯结构变化,
# cargo build 行为不变)。原 package 原位为成员, crates/* = 三件套 + contracts。
members = [".", "crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"

[package]
name = "balabala-agent-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.9.0", features = ["syntect"] }
vt100 = "0.18.1"
rfd = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = "0.29.0"
# Cargo 需要 ssh:// 形式（scp 风格 git@host:path 不被 URL 解析器接受）
pi-shell-rs = { git = "ssh://git@github.com/xxponline/pi-shell-rs.git" }
directories = "6.0.0"
# GUI = 框架的普通参与者 (D11): 依赖 contracts + service-manager;
# kameo 不在宿主侧 (中间层内部, 落 service-manager)
contracts = { path = "crates/contracts" }
service-manager = { path = "crates/service-manager" }
# change agent-service task 1.3: GUI -> agent-service -> service-core (design D7)
agent-service = { path = "crates/agent-service" }
# change solution-service task 2.2: GUI -> solution-service (design D1/D7)
solution-service = { path = "crates/solution-service" }
# change asset-service task 2.2: GUI -> asset-service —— 资产枚举/过滤域
# 已迁入, GUI 侧 Project 构建 filter 集并注入 Module (design D1/D3)
asset-service = { path = "crates/asset-service" }
# change add-lua-language-service: lua 索引薄壳 (design D1 — crate 持 view,
# 主 crate 只在 register_builtin 里 3 行接线)。
lua-language-service = { path = "crates/lua-language-service" }

[dev-dependencies]
# 仅测试构建启用 (resolver 不会把 dev 特性并入 cargo build)：
# gpui_kit::test 无头窗口 + ElementSnapshot bounds 断言 (pane 网格宽度契约)
gpui-kit = { version = "0.9.0", features = ["test-support"] }
# 测试 setup 驱动 solution-service 的异步 git 出口 (spawn_blocking 需要
# tokio 上下文) —— **features 与各服务 crate 完全一致** (TypeId 纪律)。
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
# service_layer 测试: 非 tokio executor await ask future (task 6.1)
futures = "0.3"
# change add-lua-language-service 4.2: gpui-component 高亮器的语法集来源
# (`two_face::syntax::extra_newlines`) — 断言 Lua 语法在场。已在 lock
# (gpui-component 传递依赖), 提升为直接 dev-dep, 无新增下载面。
two-face = "0.4"

# debug-console change task 4.1: 进程线程数 OS 真值 (design D9)。
# 两者均已在 Cargo.lock (传递依赖), 此处仅提升为直接依赖, 无新增下载面。
[target.'cfg(target_os = "macos")'.dependencies]
# proc_pidinfo(PROC_PIDTASKINFO) -> proc_taskinfo.pti_threadnum
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Toolhelp32 快照数本 pid 线程 (features 按 Win32_* 路径所需)
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_Foundation"] }
