[package]
name = "solution-service"
version = "0.1.0"
edition.workspace = true

[dependencies]
# design D7 依赖边: solution-service -> service-core (对齐 agent-service,
# 不含 service-manager —— 骨架侧职责不进服务 crate)。
service-core = { path = "../service-core" }
# `ActionDesc`/`ExecutedBy` 落在中立命名空间 (change asset-service design D6):
# 多个服务都发布带动作的节点, 共享类型不能住在某一个服务里 —— 否则 asset
# 服务会对 solution 服务形成编译期依赖。contracts 零依赖, 不引入外部面。
contracts = { path = "../contracts" }
# solutions 文件契约 (balabala.solutions.json) 的 serde 编解码 (design D8:
# wire 载荷走 Payload::Typed 零拷贝, 仅文件 DTO 用 serde)。
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# git 子进程必须走阻塞池 (change solution-git-offload, design D1) —
# runtime 是 worker_threads(1)，同步 `Command::output()` 扛不住大仓 status。
# **features 与 agent-service / asset-service / service-manager /
# service-plugin / example-plugin 完全一致**（同一编译单元；否则 TypeId
# 分叉 —— 那几处 Cargo.toml 注释已反复强调）。
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
