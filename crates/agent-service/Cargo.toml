[package]
name = "agent-service"
version = "0.1.0"
edition.workspace = true

[dependencies]
# design D7 依赖边: agent-service -> service-core (不含 service-manager);
# gpui-kit/vt100/crossterm 为 AgentTerminal 渲染层 (4.1 迁入) 预置,
# pi-shell-rs 为会话所有权 (SessionIo 实现) —— 与 GUI 侧同版本同特性。
service-core = { path = "../service-core" }
gpui-kit = { version = "0.9.0", features = ["syntect"] }
vt100 = "0.18.1"
crossterm = "0.29.0"
pi-shell-rs = { git = "ssh://git@github.com/xxponline/pi-shell-rs.git" }
# drain 循环的 timer (task 2.6, design D7 补充): 与 service-manager/
# service-plugin/example-plugin **features 完全一致** (同一编译单元,
# D12 已踩过的坑); agent-service 与宿主同二进制, 无 dylib 边界风险。
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
