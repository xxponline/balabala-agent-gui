[package]
name = "service-manager"
version = "0.1.0"
edition.workspace = true
description = "服务管理框架: Router/Scanner/Loader/Supervisor + 自建 tokio 运行时"

[dependencies]
service-core = { path = "../service-core" }
libloading = "0.8"
kameo = "0.22.2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }

[dev-dependencies]
# 非 tokio executor: 验证 call() 返回的 future executor-agnostic (task 4.1)
futures = "0.3"
